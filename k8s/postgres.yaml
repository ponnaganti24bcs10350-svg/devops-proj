apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-postgres
  namespace: cloudpulse
  labels:
    app: cloudpulse-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudpulse-postgres
  template:
    metadata:
      labels:
        app: cloudpulse-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "cloudpulse_db"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cloudpulse-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudpulse-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d cloudpulse_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cloudpulse-postgres
  namespace: cloudpulse
  labels:
    app: cloudpulse-postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: cloudpulse-postgres

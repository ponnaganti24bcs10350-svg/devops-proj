apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudpulse-config
  namespace: cloudpulse
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  PORT: "8000"
  POSTGRES_HOST: "cloudpulse-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "cloudpulse_db"
  DATABASE_URL: "postgresql://postgres:postgres_password_dev@cloudpulse-postgres:5432/cloudpulse_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudpulse-secret
  namespace: cloudpulse
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres_password_dev"

{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudpulse-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudpulse.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | default "nginx" }}
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cloudpulse-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: cloudpulse-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: cloudpulse-backend
                port:
                  number: {{ .Values.backend.service.port }}
          
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudpulse-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}

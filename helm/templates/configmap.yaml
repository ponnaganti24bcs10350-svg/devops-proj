apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudpulse-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudpulse.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.backend.env.ENVIRONMENT | quote }}
  LOG_LEVEL: {{ .Values.backend.env.LOG_LEVEL | quote }}
  PORT: {{ .Values.backend.env.PORT | quote }}
  POSTGRES_HOST: {{ .Values.backend.env.POSTGRES_HOST | quote }}
  POSTGRES_PORT: {{ .Values.backend.env.POSTGRES_PORT | quote }}
  POSTGRES_DB: {{ .Values.backend.env.POSTGRES_DB | quote }}
  DATABASE_URL: "postgresql://postgres:postgres_password_dev@cloudpulse-postgres:5432/cloudpulse_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudpulse-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudpulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}

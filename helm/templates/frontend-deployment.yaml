apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    app: cloudpulse-frontend
    {{- include "cloudpulse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: cloudpulse-frontend
  template:
    metadata:
      labels:
        app: cloudpulse-frontend
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.frontend.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.frontend.securityContext.runAsUser }}
        runAsGroup: {{ .Values.frontend.securityContext.runAsGroup }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.service.targetPort }}
              name: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.frontend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.frontend.readinessProbe | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: cloudpulse-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    app: cloudpulse-frontend
    {{- include "cloudpulse.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: cloudpulse-frontend
